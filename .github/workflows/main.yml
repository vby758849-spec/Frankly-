name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          ZIP=$(find . -maxdepth 1 -iname "*.zip" | head -n 1)
          echo "Zip: $ZIP"
          unzip -q "$ZIP" -d project

      - name: Patch PageView (zoom + English)
        run: |
          F=$(find project -name PageView.kt | head -n 1)
          echo "Found: $F"
          sed -i 's/matchParentSize/fillMaxSize/g' "$F"
          cat > "$(dirname "$F")/ZoomState.kt" <<'EOF'
          package com.vaibhav.pdfstudio

          import androidx.compose.runtime.getValue
          import androidx.compose.runtime.mutableStateOf
          import androidx.compose.runtime.setValue

          object ZoomState {
              var zoom by mutableStateOf(1f)
              var panX by mutableStateOf(0f)
          }
          EOF
          python3 - "$F" <<'PY'
          import sys
          p = sys.argv[1]
          s = open(p).read()

          def rep(old, new):
              global s
              if old not in s:
                  print("NOT FOUND:", old)
                  return
              s = s.replace(old, new, 1)

          rep("import kotlin.math.max", """import kotlin.math.max
          import kotlin.math.roundToInt
          import androidx.compose.foundation.layout.requiredWidth
          import androidx.compose.foundation.layout.offset
          import androidx.compose.foundation.gestures.awaitEachGesture
          import androidx.compose.foundation.gestures.awaitFirstDown
          import androidx.compose.foundation.gestures.calculateZoom
          import androidx.compose.foundation.gestures.calculatePan""")

          rep("val widthPx = with(LocalDensity.current) { maxWidth.roundToPx() }", """val maxPx = with(LocalDensity.current) { maxWidth.toPx() }
                  val zoomStep = (ZoomState.zoom * 4).roundToInt() / 4f
                  val widthPx = with(LocalDensity.current) { (maxWidth * zoomStep).roundToPx() }""")

          rep("Box(Modifier.fillMaxWidth().aspectRatio(bmp.width.toFloat() / bmp.height)) {", """Box(
                      Modifier
                          .requiredWidth(maxWidth * ZoomState.zoom)
                          .offset {
                              val lim = maxPx * (ZoomState.zoom - 1f) / 2f
                              IntOffset(ZoomState.panX.coerceIn(-lim, lim).roundToInt(), 0)
                          }
                          .aspectRatio(bmp.width.toFloat() / bmp.height)
                          .pointerInput(maxPx) {
                              awaitEachGesture {
                                  awaitFirstDown(requireUnconsumed = false)
                                  do {
                                      val event = awaitPointerEvent()
                                      if (event.changes.size >= 2) {
                                          val z = event.calculateZoom()
                                          val pan = event.calculatePan()
                                          ZoomState.zoom = (ZoomState.zoom * z).coerceIn(1f, 4f)
                                          val lim = maxPx * (ZoomState.zoom - 1f) / 2f
                                          ZoomState.panX = (ZoomState.panX + pan.x).coerceIn(-lim, lim)
                                          event.changes.forEach { it.consume() }
                                      }
                                  } while (event.changes.any { it.pressed })
                              }
                          }
                  ) {""")

          rep("Tool.NONE -> Modifier", "Tool.NONE -> Modifier.pointerInput(Unit) { detectTapGestures(onDoubleTap = { ZoomState.zoom = if (ZoomState.zoom > 1f) 1f else 2f; ZoomState.panX = 0f }) }")

          rep('Text("Text likho")', 'Text("Write text")')
          rep('Text("Yahan text")', 'Text("Enter text here")')
          rep('Text("Text replace karo")', 'Text("Replace text")')
          rep('Text("Naya text (khali = sirf mita do)")', 'Text("New text (leave empty to erase)")')

          open(p, "w").write(s)
          PY

      - name: Show other text
        run: |
          find project -name strings.xml -exec cat {} \;
          grep -rn 'Text(' --include=*.kt project | grep -v PageView.kt | head -80

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          DIR=$(dirname "$(find project -name settings.gradle* | head -n 1)")
          cd "$DIR"
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: project/**/*.apk
