name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          ZIP=$(find . -maxdepth 1 -iname "*.zip" | head -n 1)
          echo "Zip: $ZIP"
          unzip -q "$ZIP" -d project

      - name: Fix PageView
        run: |
          F=$(find project -name PageView.kt | head -n 1)
          echo "Found: $F"
          sed -i 's/matchParentSize/fillMaxSize/g' "$F"
          grep -q "layout.fillMaxSize" "$F" || sed -i '0,/^import /s//import androidx.compose.foundation.layout.fillMaxSize\nimport /' "$F"
          echo "---- PageView.kt ----"
          cat "$F"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          DIR=$(dirname "$(find project -name settings.gradle* | head -n 1)")
          cd "$DIR"
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: project/**/*.apk
